# Production-safe defaults. Local development settings are in application-dev.yml
# (`gradlew bootRun` activates the dev profile automatically).
# Values in ${...} come from environment variables or the .env file in the working directory.

# Server Configuration
server:
  port: 8000
  address: 0.0.0.0
  compression:
    enabled: true
  error:
    include-stacktrace: never

# Spring Configuration
spring:
  application:
    name: base-project
  config:
    # Load KEY=value pairs from .env (ignored when the file does not exist, e.g. in Docker)
    import: optional:file:.env[.properties]
  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSSXXX
    time-zone: UTC

  # Database Configuration
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?currentSchema=${DB_SCHEMA}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 1
      maximum-pool-size: 15
      idle-timeout: 30000
      pool-name: HikariPostgresPool
      max-lifetime: 2000000
      auto-commit: true
      transaction-isolation: TRANSACTION_READ_COMMITTED
      connection-timeout: 30000

  flyway:
    enabled: true
    # Fail instead of silently skipping migrations when pointed at a non-empty schema
    # that Flyway has never managed.
    baseline-on-migrate: false
    validate-migration-naming: true
    locations: "classpath:db/migration"
    schemas: ${DB_SCHEMA}

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false

  # Servlet Configuration
  servlet:
    multipart:
      enabled: true
      max-file-size: ${MAX_UPLOAD_SIZE:20971520}
      max-request-size: ${MAX_UPLOAD_SIZE:20971520}
      resolve-lazily: false

# Application settings
app:
  base-url: ${APP_BASE_URL:http://localhost:8000}
  cors:
    # Comma-separated list of frontend origins allowed to call the API
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    # Email/password login with the app's own tokens. Needs a valid secret when true.
    enabled: ${JWT_ENABLED:true}
    # Base64, at least 256 bits
    secret: ${JWT_SECRET:}
    # Token lifetimes in milliseconds: 15 minutes and 7 days
    access-token-expiration: ${JWT_ACCESS_EXPIRATION:900000}
    refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
  user:
    join-date-format: ${USER_JOIN_DATE_FORMAT:yyyy-MM-dd}

# Actuator: only health and info are exposed over HTTP
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

# Swagger / OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

firebase:
  # false = start without Firebase: login, registration and file uploads answer 503,
  # protected endpoints answer 401. Everything else works.
  enabled: ${FIREBASE_ENABLED:true}
  config:
    path: ${FIREBASE_CONFIG_PATH:firebase-service-account.json}
  storage:
    bucket: ${BUCKET_NAME:}
    url: ${FIREBASE_URL:https://firebasestorage.googleapis.com/v0/b/}

avatar:
  max-size: ${AVATAR_MAX_SIZE:5242880}
  allowed-formats: ${AVATAR_ALLOWED_FORMATS:image/jpeg,image/png,image/webp}
