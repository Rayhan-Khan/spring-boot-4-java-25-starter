# Production-style deployment: builds the image and runs the app against the database in .env.
# For a local development database, use docker-compose.dev.yml instead.
services:
  app:
    image: base_project_image
    build:
      context: .
      dockerfile: Dockerfile
    container_name: base_project_container
    env_file:
      - .env
    restart: always
    ports:
      - "8000:8000"
    networks:
      - app_network
networks:
  app_network:
    driver: bridge
